name: Deploy free Taiwan research API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'static/screener.js', '.github/workflows/deploy-api.yml']
permissions:
  contents: write
concurrency:
  group: deploy-stockroom-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/worker.test.cjs
      - name: Check required settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os
          assert all(os.environ.get(k) for k in ('CF_TOKEN','CF_ACCOUNT','FINMIND_TOKEN')), 'Please configure the documented Actions Secrets first.'
          PYCODE
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: "4.158.0"
          secrets: |
            FINMIND_TOKEN
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Publish automatic connection settings
        env:
          API_URL: ${{ steps.deploy.outputs.deployment-url }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PYCODE'
          import json,os,urllib.parse,urllib.request,datetime
          u=urllib.parse.urlparse(os.environ['API_URL'].strip())
          assert u.scheme=='https' and u.hostname.endswith('.workers.dev') and not u.username and not u.password and not u.port, 'Deployment URL is missing or invalid'
          base='https://'+u.hostname
          check={'status':'unavailable'}
          deployed={}
          health={}
          ai_check={}
          try:
              request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/workers/scripts/stockroom-api',headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'User-Agent':'Stockroom-Website-Check/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response: body=response.read().decode('utf-8',errors='replace')
              deployed={'hasCurrentRevision':'20261110-full-brief-v3' in body,'hasFallback':'cachedAt' in body}
          except Exception:deployed={'inspection':'unavailable'}
          try:
              request=urllib.request.Request(base+'/health',headers={'Origin':'https://timo893131.github.io','User-Agent':'Stockroom-Website-Check/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response: health=json.load(response)
          except Exception:health={'status':'unavailable'}
          try:
              req=urllib.request.Request(base+'/brief',data=b'{"readOnly":true}',headers={'Content-Type':'application/json','Origin':'https://timo893131.github.io','User-Agent':'Stockroom-Website-Check/1.0'},method='POST')
              with urllib.request.urlopen(req,timeout=90) as response: result=json.load(response)
              assert result.get('ai',{}).get('status')=='ready' or (result.get('mode')=='published' and len(result.get('items',[]))>0)
              check={'status':'ready','count':result['count'],'mode':result.get('mode'),'generatedAt':result.get('ai',{}).get('generatedAt'),'fallbackReason':result.get('reason')}
          except Exception:
              print('AI smoke check unavailable; public connection settings will still be published.')
          # One actual stock analysis verifies the binding after deployment. It uses
          # the same ten-attempt budget and cache as visitors; never retry/reset it.
          try:
              req=urllib.request.Request(base+'/research',data=b'{"symbol":"2603.TW","ai":true}',headers={'Content-Type':'application/json','Origin':'https://timo893131.github.io','User-Agent':'Stockroom-Website-Check/1.0'},method='POST')
              with urllib.request.urlopen(req,timeout=90) as response: result=json.load(response)
              a=result.get('ai',{})
              ai_check={'status':a.get('status'),'model':a.get('model'),'action':a.get('action'),'reason':a.get('reason'),'generatedAt':a.get('generatedAt'),'symbol':result.get('quote',{}).get('symbol')}
          except urllib.error.HTTPError as error:
              try: reason=json.load(error).get('error','Service unavailable')
              except Exception: reason='Service unavailable'
              ai_check={'status':'unavailable','reason':reason}
          except Exception: ai_check={'status':'unavailable'}
          with open(os.environ['RUNNER_TEMP']+'/stockroom-api.json','w') as out:
              json.dump({'url':base,'mode':'public','commit':os.environ['GITHUB_SHA'],'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'briefCheck':check,'deployedCode':deployed,'healthCheck':health,'aiCheck':ai_check},out)
          PYCODE
          if git fetch origin service-config; then
            git checkout -B service-config FETCH_HEAD
          else
            git checkout --orphan service-config
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/stockroom-api.json" api.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish public API connection address'
            git push origin service-config
          fi
