name: Deploy free Taiwan research API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/worker.test.cjs
      - name: Check required settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ACCESS: ${{ secrets.STOCKROOM_ACCESS_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PYCODE'
          import os
          assert all(os.environ.get(k) for k in ('CF_TOKEN','CF_ACCOUNT','FINMIND_TOKEN','GEMINI_API_KEY')), 'Please configure the documented Actions Secrets first.'
          assert len(os.environ.get('API_ACCESS','')) >= 24, 'STOCKROOM_ACCESS_KEY must have at least 24 characters.'
          PYCODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: "4.158.0"
          secrets: |
            FINMIND_TOKEN
            GEMINI_API_KEY
            ACCESS_KEY
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_KEY: ${{ secrets.STOCKROOM_ACCESS_KEY }}
