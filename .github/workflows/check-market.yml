name: Check market API (no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - check_market.py
      - .github/workflows/check-market.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check FinMind response without publishing data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python check_market.py
