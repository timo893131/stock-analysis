name: Publish Stockroom (free Pages)
on:
  workflow_dispatch:
    inputs:
      demo:
        description: 'Publish demo only (uncheck after confirming API public-display rights)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'tests/**'
      - 'market.py'
      - 'universe.py'
      - 'catalog.py'
      - 'full_market.py'
      - 'fundamentals.py'
      - 'ai_analysis.py'
      - 'export_site.py'
      - '.github/workflows/pages.yml'
  schedule:
    # 18:20 and 22:20 Asia/Taipei, Monday to Friday; GitHub can delay runs.
    - cron: '20 10,14 * * 1-5'
permissions:
  contents: read
concurrency:
  group: stockroom-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'schedule' || vars.MARKET_DATA_PUBLIC_DISPLAY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test --test-isolation=none tests/*.test.cjs
      - name: Synchronize daily data
        if: (github.event_name == 'workflow_dispatch' && !inputs.demo) || (github.event_name != 'workflow_dispatch' && vars.MARKET_DATA_PUBLIC_DISPLAY == 'true')
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PUBLIC_DISPLAY: ${{ vars.MARKET_DATA_PUBLIC_DISPLAY }}
        run: |
          test "$PUBLIC_DISPLAY" = true || { echo 'Confirm provider public-display rights and set MARKET_DATA_PUBLIC_DISPLAY=true first.'; exit 1; }
          python full_market.py
          python catalog.py
          python sync_market.py
      - name: Update financial health data when licensed
        if: vars.FUNDAMENTALS_PUBLIC_DISPLAY == 'true' && ((github.event_name == 'workflow_dispatch' && !inputs.demo) || (github.event_name != 'workflow_dispatch' && vars.MARKET_DATA_PUBLIC_DISPLAY == 'true'))
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fundamentals.py
      - name: Generate optional AI explanations
        if: vars.AI_ANALYSIS_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && !inputs.demo) || (github.event_name != 'workflow_dispatch' && vars.MARKET_DATA_PUBLIC_DISPLAY == 'true'))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python ai_analysis.py
      - name: Export market site
        if: (github.event_name == 'workflow_dispatch' && !inputs.demo) || (github.event_name != 'workflow_dispatch' && vars.MARKET_DATA_PUBLIC_DISPLAY == 'true')
        run: python export_site.py
      - name: Export demo site
        if: (github.event_name == 'workflow_dispatch' && inputs.demo) || (github.event_name == 'push' && vars.MARKET_DATA_PUBLIC_DISPLAY != 'true')
        run: python export_site.py --demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify full-market AI once after publication
        if: vars.MARKET_DATA_PUBLIC_DISPLAY == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.demo)
        continue-on-error: true
        run: |
          python - <<'PYCODE'
          import json,urllib.request,urllib.parse
          headers={'Origin':'https://timo893131.github.io','User-Agent':'Stockroom-Website-Check/1.0','Content-Type':'application/json'}
          with urllib.request.urlopen('https://raw.githubusercontent.com/timo893131/stock-analysis/service-config/api.json',timeout=20) as r: config=json.load(r)
          u=urllib.parse.urlparse(config['url'])
          assert u.scheme=='https' and u.hostname.endswith('.workers.dev') and not u.username and not u.password and not u.port
          base='https://'+u.hostname
          with urllib.request.urlopen(urllib.request.Request(base+'/health',headers=headers),timeout=20) as r: health=json.load(r)
          assert health.get('apiRevision')=='20261112-beginner-sizing-v4', 'AI backend is still upgrading; no model call made'
          # Exactly one attempt through the normal shared ten-per-day budget; no retries.
          request=urllib.request.Request(base+'/brief',data=b'{}',headers=headers,method='POST')
          with urllib.request.urlopen(request,timeout=90) as r: result=json.load(r)
          assert result.get('scopeVersion')==3 and result.get('ai',{}).get('status')=='ready'
          print(json.dumps({k:result.get(k) for k in ('scopeVersion','count','total','sourceComplete','candidateCounts','dates')},ensure_ascii=False))
          PYCODE
