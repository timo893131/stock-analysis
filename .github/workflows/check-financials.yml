name: Check real financial API (no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - check_financials.py
      - .github/workflows/check-financials.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check four real financial datasets
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python check_financials.py
